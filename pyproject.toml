[project]
name = "phytoanalytic-engine"
version = "1.0.0"
description = "REST API that classifies plant leaf diseases with a ResNet9 model."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
